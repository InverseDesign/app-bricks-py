[build-system]
# 已移除 setuptools_scm：原项目依赖 git tag 解析版本，在非 tag 提交/本地编辑安装时无法工作
requires = ["setuptools>=77,<81", "wheel", "docstring_parser>=0.16", "msgpack>=1.0.0", "watchdog", "requests", "Pillow", "numpy", "pyyaml"]
# 已切回标准 setuptools 后端：原 builder 强依赖 setuptools_scm 读 git tag，与本分支移除 setuptools_scm 的决定冲突
build-backend = "setuptools.build_meta"

[project]
name = "arduino_app_bricks"
# 通过 attr 指令从 src/arduino/_version.py 读取版本（取代原 setuptools_scm 动态生成）
version = "attr: arduino._version.__version__"
authors = [
  { name="Marco Colombo", email="m.colombo@arduino.cc" },
  { name="Roberto Gazia", email="r.gazia@arduino.cc" },
]
description = "Arduino App Bricks for Apps Lab"
readme = "README.md"
# 锁定 Python 3.12：mediapipe 官方 wheel 最新支持到 3.12，3.13 不可用
requires-python = ">=3.12,<3.13"
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml",
    "requests",
    "Pillow",
    "msgpack",
]

[project.optional-dependencies]
dev = [
    "setuptools",
    "build",
    "pytest",
    "pytest-asyncio",
    "websocket-client",
    "ruff==0.14.2",
    "docstring_parser>=0.16",
    "arduino_app_bricks[all]",
    "deepeval",
    "mcp",
    "langchain_mcp_adapters",
    "langchain_ollama",
]
dbstorage_influx = [
    "influxdb_client>=1.48.0",
]
mqtt = [
    "paho_mqtt>=2.1.0",
]
folderwatcher = [
    "watchdog>=6.0.0",
]
usb_camera = [
    "opencv-python-headless==4.13.0.92",
]
microphone = [
    "pyalsaaudio==0.11.0; sys_platform == 'linux'",
    "numpy",
]
web_ui = [
    "fastapi>=0.121.0",
    "fastapi_socketio",
    "uvicorn[standard]",
    "cryptography",
]
streamlit_ui = [
    # Deps are a pre-requirement
]
mood_detector = [
    "nltk",
]
stream = [
    "websockets",
]
arduino_cloud = [
    "arduino-iot-cloud",
]
telegram_bot = [
    "python-telegram-bot>=21.1",
]
cloud_llm = [
    "langchain-core >=1.2.6",
    "langchain-anthropic >=1.3.1",
    "langchain-openai >=1.1.6",
    "langchain-google-genai >=4.1.3",
]
cloud_asr = [
    "websocket-client",
    "google-cloud-speech>=2.27.0",
]

all = [
    "arduino_app_bricks[dbstorage_influx]",
    "arduino_app_bricks[mqtt]",
    "arduino_app_bricks[folderwatcher]",
    "arduino_app_bricks[usb_camera]",
    "arduino_app_bricks[microphone]",
    "arduino_app_bricks[web_ui]",
    "arduino_app_bricks[streamlit_ui]",
    "arduino_app_bricks[mood_detector]",
    "arduino_app_bricks[stream]",
    "arduino_app_bricks[arduino_cloud]",
    "arduino_app_bricks[telegram_bot]",
    "arduino_app_bricks[cloud_llm]",
    "arduino_app_bricks[cloud_asr]",
]

[project.urls]
"Homepage" = "https://github.com/arduino/app-bricks-py"

[project.scripts]
arduino-bricks-list-modules = "arduino.app_tools.module_listing:main"
arduino-bricks-release = "arduino.app_tools.module_listing:release"
arduino-bricks-update-ai-container-ref = "arduino.app_tools.module_listing:update_ai_container_references"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

# 已删除 [tool.setuptools_scm] 块：版本已写死，不再需要 git tag 解析

[tool.ruff]
line-length = 150
preview = true

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 150

[tool.ruff.lint]
select = [
    "E501",    # line too long
    "D100",    # missing docstring in public module
    "D206",    # Docstring should be indented with 4 spaces
    "D417",    # Missing argument descriptions in the docstring
    "D419",    # Missing return description in the docstring
    "F401",    # imported but unused
    "F841",    # local variable 'x' is assigned to but never used
    "E302",    # expected 2 blank lines, found 1
    "E303",    # too many blank lines (3)
    "E711",    # comparison to None should be 'if cond is None:'
    "E712",    # comparison to True should be 'if cond is True:' or 'if cond is False:'
    "E713",    # test for membership should be 'not in'
    "E714",    # test for object identity should be 'is not'
    "E721",    # do not compare types, use 'isinstance()'
    "E203",    # whitespace before ':'
    "E225",    # missing whitespace around operator
    "E231",    # missing whitespace after ','
    "E251",    # unexpected spaces around keyword / parameter equals
    "E261",    # at least two spaces required before inline comment
    "E262",    # inline comment should start with '# '
    "W291",    # at least two spaces before inline comment
    "W292",    # no newline at end of file
    "W293",    # blank line contains whitespace
    "W391",    # too many blank line at end of file
]
ignore = [
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D206",    # Docstring should be indented with 4 spaces
]

[tool.ruff.lint.pydocstyle]
convention = "google"
